# One compose project per registered project. Driven by bin/proj:
#   docker compose -p proj-<name> --env-file ~/.agent-hub/projects/<name>.env -f compose/project.yml up -d
services:
  agent:
    image: ${IMAGE:-agent-hub:base}
    init: true
    # Same absolute path as the host: git worktree metadata must resolve on both sides.
    working_dir: ${PROJECT_DIR:?}
    environment:
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}
    env_file:
      - path: ${ACCOUNT_DIR:?}/git.env
        required: false
    secrets: [claude_token, gh_token]
    volumes:
      - ${PROJECT_DIR}:${PROJECT_DIR}
      - ${HARNESS_DIR:?}:/opt/harness:ro
      - ${TASKS_DIR:?}:/var/agent-hub/tasks
      - claude-config:/home/node/.claude
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    mem_limit: ${MEM_LIMIT:-6g}

volumes:
  claude-config:
  # Re-downloadable caches shared by all projects; bin/proj creates them.
  cargo-registry: { external: true }
  cargo-git: { external: true }

secrets:
  claude_token:
    file: ${ACCOUNT_DIR}/claude.token
  gh_token:
    file: ${ACCOUNT_DIR}/gh.token
