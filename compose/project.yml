# One compose project per registered project. Driven by bin/proj:
#   docker compose -p proj-<name> --env-file ~/.agent-hub/projects/<name>.env -f compose/project.yml up -d
services:
  agent:
    image: ${IMAGE:-agent-hub:base}
    init: true
    # Same absolute path as the host: git worktree metadata must resolve on both sides.
    working_dir: ${PROJECT_DIR:?}
    environment:
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}
      # Host Docker only through the project's proxy below; the agent never gets the socket.
      DOCKER_HOST: tcp://docker:2375
      DOCKER_BUILDKIT: "0"  # BuildKit needs /session and /grpc, which the proxy does not pass
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal  # published ports are on the host, not on `docker`
      TESTCONTAINERS_RYUK_DISABLED: "true"  # Ryuk mounts the socket; proj down/rm clean up by label instead
    depends_on: [docker]
    env_file:
      - path: ${ACCOUNT_DIR:?}/git.env
        required: false
    secrets: [claude_token, gh_token]
    volumes:
      - ${PROJECT_DIR}:${PROJECT_DIR}
      - ${HARNESS_DIR:?}:/opt/harness:ro
      - ${TASKS_DIR:?}:/var/agent-hub/tasks
      - claude-config:/home/node/.claude
      - ${SESSIONS_DIR:?}:/home/node/.claude/projects  # session transcripts, readable on the host (bin/proj sets it)
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    mem_limit: ${MEM_LIMIT:-6g}

  # Docker API proxy (dockerproxy/server.py): holds the host socket, lets the agent use only this project's
  # containers, volumes and networks (label agent-hub.project). Never label this service or `agent`.
  docker:
    image: agent-hub:dockerproxy
    init: true
    read_only: true
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?}
      PROJECT_DIR: ${PROJECT_DIR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path read-only, to resolve symlinks in bind mount sources.
      - ${PROJECT_DIR}:${PROJECT_DIR}:ro
    mem_limit: 64m

volumes:
  claude-config:
  # Re-downloadable caches shared by all projects; bin/proj creates them.
  cargo-registry: { external: true }
  cargo-git: { external: true }

secrets:
  claude_token:
    file: ${ACCOUNT_DIR}/claude.token
  gh_token:
    file: ${ACCOUNT_DIR}/gh.token
