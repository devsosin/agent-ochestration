repo: devsosin/agent-ochestration
language: ko
title_format: "[{id}] {summary}"
id_prefixes: [PROJ, HUB, IMG]
labels:
  type: [bug, enhancement, documentation]
  areas:
    - name: "area:proj"
      color: 1d76db
      description: bin/proj CLI, tasks, worktrees
      when: bin/proj 나 작업 흐름이 대상일 때
    - name: "area:image"
      color: 5319e7
      description: agent image and compose
      when: image/ 나 compose/ 가 대상일 때
    - name: "area:hub"
      color: 0e8a16
      description: main agent guide and permissions
      when: hub/ 가 대상일 때
    - name: "area:imagegen"
      color: fbca04
      description: image generation MCP
      when: imagegen/ 가 대상일 때
  review:
    name: needs-review
    color: d93f0b
    description: 사용자 검토·결정이 필요한 항목이 있음
verify:
  - bash tests/proj.test.sh
  - bash tests/imagegen.test.sh
